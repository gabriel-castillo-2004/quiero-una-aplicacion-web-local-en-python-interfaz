<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="csrf-token" content="{{ csrf_token }}" />
  <title>yt-music-dl</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0f1115;
      --card: #181c23;
      --border: #2a313d;
      --text: #e6ebf2;
      --muted: #98a2b3;
      --accent: #3b82f6;
      --danger: #ef4444;
      --warn-bg: #3b2a10;
      --warn-text: #fde68a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    main {
      width: 100%;
      max-width: 640px;
      display: grid;
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.35rem; }
    p.sub { margin: 0; color: var(--muted); font-size: 0.9rem; }
    .banner {
      background: var(--warn-bg);
      color: var(--warn-text);
      border: 1px solid #854d0e;
      border-radius: 10px;
      padding: 0.85rem 1rem;
      display: none;
    }
    .banner.visible { display: block; }
    form { display: grid; gap: 0.9rem; }
    label { display: grid; gap: 0.35rem; font-size: 0.9rem; }
    input, select, button {
      font: inherit;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #101318;
      color: var(--text);
    }
    .row { display: grid; grid-template-columns: 1fr 140px; gap: 0.75rem; }
    .actions { display: flex; gap: 0.75rem; }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }
    button.danger {
      background: transparent;
      border-color: var(--danger);
      color: var(--danger);
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-card { display: none; gap: 0.75rem; }
    .progress-card.visible { display: grid; }
    .track-header { display: flex; gap: 0.75rem; align-items: center; }
    .track-header img {
      width: 64px; height: 48px; object-fit: cover; border-radius: 6px;
      background: #0b0d11; display: none;
    }
    progress { width: 100%; height: 12px; }
    .summary { font-size: 0.9rem; color: var(--muted); }
    .error-msg { color: #fca5a5; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>yt-music-dl</h1>
      <p class="sub">Descarga canciones y playlists de YouTube en MP3 o M4A.</p>
    </div>

    <div id="ffmpeg-warning" class="banner" role="alert">
      Advertencia: <strong>ffmpeg</strong> no está disponible en el sistema. La extracción y conversión de audio fallará hasta instalarlo en PATH.
    </div>

    <div class="card">
      <form id="download-form">
        <label>
          URL de YouTube (video o playlist)
          <input id="url-input" name="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." />
        </label>
        <div class="row">
          <label>
            Carpeta de destino
            <input id="dest-input" name="dest_dir" type="text" required />
          </label>
          <label>
            Formato
            <select id="format-select" name="format">
              <option value="mp3">MP3</option>
              <option value="m4a">M4A</option>
            </select>
          </label>
        </div>
        <div class="actions">
          <button id="submit-btn" type="submit" class="primary">Descargar</button>
          <button id="cancel-btn" type="button" class="danger" disabled>Cancelar</button>
        </div>
        <div id="form-error" class="error-msg"></div>
      </form>
    </div>

    <div id="progress-card" class="card progress-card" aria-live="polite">
      <div class="track-header">
        <img id="track-thumb" alt="Miniatura" />
        <div>
          <strong id="track-title">Preparando...</strong>
          <div id="job-status" class="sub">pending</div>
        </div>
      </div>
      <progress id="progress-bar" max="100" value="0"></progress>
      <div id="progress-message" class="sub"></div>
      <div id="summary" class="summary"></div>
    </div>
  </main>

  <script>
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    const form = document.getElementById('download-form');
    const urlInput = document.getElementById('url-input');
    const destInput = document.getElementById('dest-input');
    const formatSelect = document.getElementById('format-select');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const formError = document.getElementById('form-error');
    const ffmpegBanner = document.getElementById('ffmpeg-warning');
    const progressCard = document.getElementById('progress-card');
    const trackThumb = document.getElementById('track-thumb');
    const trackTitle = document.getElementById('track-title');
    const jobStatus = document.getElementById('job-status');
    const progressBar = document.getElementById('progress-bar');
    const progressMsg = document.getElementById('progress-message');
    const summaryEl = document.getElementById('summary');

    let currentJobId = null;
    let eventSource = null;
    let pollTimer = null;

    async function init() {
      try {
        const health = await fetch('/api/health');
        const hData = await health.json();
        if (!hData.ffmpeg_available) {
          ffmpegBanner.classList.add('visible');
        }
      } catch (_) {}

      try {
        const res = await fetch('/api/default-dir');
        const data = await res.json();
        if (data.default_dir) destInput.value = data.default_dir;
      } catch (_) {}
    }

    function stopStreams() {
      if (eventSource) {
        eventSource.close();
        eventSource = null;
      }
      if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
      }
    }

    function applySnapshot(data) {
      progressCard.classList.add('visible');
      jobStatus.textContent = data.status || 'pending';
      progressBar.value = Number(data.progress || 0);
      progressMsg.textContent = data.message || '';
      if (data.current_track) trackTitle.textContent = data.current_track;
      if (data.thumbnail_url) {
        trackThumb.src = data.thumbnail_url;
        trackThumb.style.display = 'block';
      }

      const terminal = ['completed', 'failed', 'cancelled'].includes(data.status);
      if (terminal) {
        stopStreams();
        cancelBtn.disabled = true;
        submitBtn.disabled = false;
        if (data.status === 'completed') {
          const dl = data.downloaded_count ?? (data.manifest ? data.manifest.downloaded.length : 0);
          const sk = data.skipped_count ?? (data.manifest ? data.manifest.skipped_archive.length : 0);
          const fl = data.failed_count ?? (data.manifest ? data.manifest.failed.length : 0);
          summaryEl.textContent = `Descargadas: ${dl} | Saltadas (archivo): ${sk} | Fallidas: ${fl}`;
        } else if (data.status === 'failed') {
          summaryEl.textContent = `Error: ${data.error || data.message || 'Fallo en la descarga'}`;
        } else {
          summaryEl.textContent = 'Descarga cancelada.';
        }
      }
    }

    function startMonitoring(jobId) {
      stopStreams();
      currentJobId = jobId;
      cancelBtn.disabled = false;
      summaryEl.textContent = '';

      eventSource = new EventSource(`/api/jobs/${jobId}/events`);
      const handleEvent = (ev) => {
        try {
          applySnapshot(JSON.parse(ev.data));
        } catch (_) {}
      };
      ['snapshot', 'status', 'progress', 'completed', 'failed', 'cancelled'].forEach((name) => {
        eventSource.addEventListener(name, handleEvent);
      });

      pollTimer = setInterval(async () => {
        try {
          const r = await fetch(`/api/jobs/${jobId}`);
          if (r.ok) {
            const job = await r.json();
            if (job.progress) applySnapshot(job.progress);
          }
        } catch (_) {}
      }, 2000);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.textContent = '';
      submitBtn.disabled = true;

      try {
        const res = await fetch('/api/jobs', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': csrfToken,
          },
          body: JSON.stringify({
            url: urlInput.value.trim(),
            dest_dir: destInput.value.trim(),
            format: formatSelect.value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          formError.textContent = data.error || 'Error al crear el trabajo.';
          submitBtn.disabled = false;
          return;
        }
        startMonitoring(data.job_id);
      } catch (err) {
        formError.textContent = 'Error de conexión con el servidor local.';
        submitBtn.disabled = false;
      }
    });

    cancelBtn.addEventListener('click', async () => {
      if (!currentJobId) return;
      cancelBtn.disabled = true;
      await fetch(`/api/jobs/${currentJobId}/cancel`, {
        method: 'POST',
        headers: { 'X-CSRF-Token': csrfToken },
      });
    });

    init();
  </script>
</body>
</html>
